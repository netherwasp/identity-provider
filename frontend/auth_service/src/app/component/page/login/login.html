<div class="login-container">
  <div class="login-card">
    <h2>Identity Provider</h2>
    <p>Not a member? <a (click)="onSignUp()">Sign-Up Now</a></p>
    
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
      <div class="input-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="Enter username" required />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Enter password" required />
      </div>

      <p-button type="submit" [disabled]="loginForm.invalid">
        Sign In
      </p-button>
    </form>
  </div>
</div>
